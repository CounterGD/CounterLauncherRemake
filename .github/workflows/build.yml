name: Build CounterLauncher

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            squashfs-tools \
            libfuse2 \
            file

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller \
            --onefile \
            --name CounterLauncher \
            minecraft_dl.py

      - name: Create AppDir
        run: |
          mkdir -p AppDir/usr/bin

          cp dist/CounterLauncher AppDir/usr/bin/

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/CounterLauncher" "$@"
          EOF

          chmod +x AppDir/AppRun

          cat > AppDir/CounterLauncher.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=CounterLauncher
          Comment=Minecraft Launcher
          Exec=CounterLauncher
          Icon=CounterLauncher
          Terminal=true
          Categories=Game;
          EOF

      - name: Copy application icon
        run: |
          cp channels4_profile_256.png AppDir/CounterLauncher.png

      - name: Download appimagetool
        run: |
          wget -O appimagetool \
            https://github.com/AppImage/appimagetool/releases/latest/download/appimagetool-x86_64.AppImage

          chmod +x appimagetool

      - name: Build AppImage
        run: |
          ./appimagetool AppDir

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CounterLauncher-AppImage
          path: "*.AppImage"
